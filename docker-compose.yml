services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-wallet-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT}:${PORT}"
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - wallet-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: personal-wallet-tunnel
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env
    networks:
      - wallet-net
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

networks:
  wallet-net:
    driver: bridge
