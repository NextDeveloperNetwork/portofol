services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-wallet-app
    restart: unless-stopped
    environment:
      - DATABASE_URL
      - PORT=${PORT:-3000}
      - JWT_SECRET
    ports:
      - "${HOST_PORT:-48921}:${PORT:-3000}"
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - wallet-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: personal-wallet-tunnel
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN
    networks:
      - wallet-net
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

networks:
  wallet-net:
    driver: bridge
