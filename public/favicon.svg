<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Wallet Body -->
  <rect x="6" y="12" width="52" height="40" rx="10" fill="url(#walletGrad)"/>

  <!-- Stripe Accent -->
  <path d="M6 24h52" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

  <!-- Microchip / Vault Clasp -->
  <rect x="38" y="26" width="18" height="14" rx="4" fill="url(#chipGrad)"/>
  <circle cx="43" cy="33" r="2" fill="#78350f"/>
  <circle cx="49" cy="33" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Glow Dot -->
  <circle cx="16" cy="20" r="3" fill="#34d399"/>
</svg>
