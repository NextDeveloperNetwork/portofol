<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet Master Access — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <!-- Clean Navbar -->
  <header class="navbar">
    <div class="container-fluid" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <a href="/" class="logo-group">
        <div class="wallet-chip-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
        </div>
        <span class="logo-text">Personal Wallet <span class="logo-badge">Vault</span></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/about" class="nav-link">About Me</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div style="width: 100%; max-width: 440px; background: #ffffff; border: 1px solid var(--border-light); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 56px; height: 56px; border-radius: var(--radius-md); background: #eef2ff; color: var(--accent-primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">Wallet Master Login</h1>
        <p style="font-size: 0.95rem; color: var(--text-secondary);">Authenticate to edit landing page content, add websites, and upload files.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Admin Username</label>
          <input type="text" id="username" class="form-input" placeholder="admin" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span id="btnText">Unlock Management Vault</span>
        </button>
      </form>

      <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); text-align: center;">
        <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 0.6rem;">Quick Testing Access</p>
        <button type="button" class="btn-secondary" style="font-size: 0.85rem; padding: 0.45rem 1rem;" onclick="fillDemoCredentials()">
          Auto Fill Demo Credentials
        </button>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script src="/js/auth.js"></script>
</body>
</html>
